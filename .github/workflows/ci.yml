name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # REASON: pas de `version:` ici — pnpm/action-setup@v5 refuse la double
      # déclaration et lit `packageManager` de package.json (source unique).
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Les peer deps @aexae/* sont des packages GitHub Packages privés :
      # l'install échoue en 401 sans jeton (cf. .npmrc → ${NPM_AUTH_TOKEN}).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # GITHUB_TOKEN (Actions, permissions: packages: read) : lit les packages
          # @aexae privés qui accordent l'Actions access à ce dépôt. Plus de PAT.
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
